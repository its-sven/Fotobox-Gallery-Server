# Fotobox Galerie – Docker Compose
# Start:   docker compose up -d
# Update:  docker compose pull && docker compose up -d
services:
  fotobox:
    image: ghcr.io/its-sven/fotobox-gallery-server:latest
    # Stattdessen aus dem geklonten Quellcode bauen: nächste Zeile einkommentieren und
    # "docker compose up -d --build" verwenden.
    # build: .
    container_name: fotobox-gallery
    restart: unless-stopped
    # Kein "user:" setzen – der Container setzt die Rechte selbst und läuft dann als PUID:PGID.
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SITE_EYEBROW: ${SITE_EYEBROW:-Fotobox}
      SITE_TITLE: ${SITE_TITLE:-Fotobox Galerie}
      CREDIT_NAME: ${CREDIT_NAME-Sven Würth}
      CREDIT_URL: ${CREDIT_URL-https://svenw.de}
      PREGENERATE: ${PREGENERATE:-true}
    volumes:
      - ${DATA_PATH:-/opt/fotobox}:/opt/fotobox
