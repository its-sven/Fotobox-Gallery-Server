name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Server starten
        run: |
          DATA_ROOT=./data ADMIN_PASSWORD=ci COOKIE_SECURE=false PORT=3001 node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/healthz && break; sleep 1; done
      - name: Smoke-Test
        run: |
          scripts/smoke-test.sh http://localhost:3001 ci ./data | tee result.txt
          grep -q ", 0 fehlgeschlagen" result.txt
      - name: Server-Log
        if: always()
        run: cat server.log
